name: Deploy ASCENSION AI tutor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/ascension-tutor/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-ai-tutor.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in repository Actions secrets first."
            exit 1
          fi
          supabase functions deploy ascension-tutor --remote=wgaqbohzxelcmmtwhfbg --yes
